<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — PDFnest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <script src="auth-guard.js"></script>
    <script src="theme.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .google-login-section {
            margin-top: 20px;
        }

        .google-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0;
            color: #888;
            font-size: 12px;
        }

        .google-divider::before,
        .google-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .google-circle-btn {
            width: 42px;
            height: 42px;
            padding: 10px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 50%;
            background: #21172f;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease,
                transform 0.2s ease, box-shadow 0.2s ease;
        }

        .google-circle-btn svg {
            width: 22px;
            height: 22px;
            display: block;
        }

        .google-circle-btn:hover {
            background: #302040;
            border-color: #a855f7;
            box-shadow: 0 0 14px rgba(139, 92, 246, 0.25);
            transform: translateY(-1px);
        }

        .google-circle-btn:focus-visible {
            outline: 2px solid #a855f7;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome back</h2>
            <p class="subtitle">Log in to access your PDF tools.</p>

            <form id="loginForm">
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="youremail@example.com" required />
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required />

                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="forgot-password">
                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">Log In</button>
                <div class="error-msg" id="errorMsg"></div>
            </form>

            <!-- Google Login -->
            <!-- Google Login -->
            <div class="google-login-section">
                <div class="google-divider">
                    <span>OR</span>
                </div>

                <div id="g_id_onload" data-callback="handleGoogleCredential" data-auto_prompt="false">
                </div>

                <button type="button" class="google-circle-btn" id="googleLoginBtn" aria-label="Continue with Google"
                    title="Continue with Google">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#4285F4"
                            d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z" />
                        <path fill="#34A853"
                            d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z" />
                        <path fill="#FBBC05" d="M12.6 27.7a12 12 0 0 1 0-7.4V15H5.8a20 20 0 0 0 0 18Z" />
                        <path fill="#EA4335"
                            d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8A19.4 19.4 0 0 0 24 4 20 20 0 0 0 5.8 15l6.8 5.3C14.2 15.7 18.7 12.1 24 12.1Z" />
                    </svg>
                </button>
            </div>


            <div class="auth-switch">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://pdf-generator-ochre-two.vercel.app/api/auth';
        let googleClientId = null;

        async function loadGoogleConfiguration() {
            try {
                const response = await fetch(
                    'https://pdf-generator-ochre-two.vercel.app/api/config'
                );

                if (!response.ok) {
                    throw new Error('Could not load Google configuration');
                }

                const config = await response.json();
                googleClientId = config.googleClientId;

                if (!googleClientId) {
                    throw new Error('Google Client ID is missing on the server');
                }

                // Initialize Google Identity Services
                google.accounts.id.initialize({
                    client_id: googleClientId,
                    callback: window.handleGoogleCredential,
                    auto_select: false
                });

            } catch (error) {
                console.error('Google configuration error:', error);
                errorMsg.textContent = 'Google sign-in is temporarily unavailable.';
            }
        }
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');



        /* ============================================================
           GOOGLE LOGIN
           ============================================================ */

        window.handleGoogleCredential = async function (response) {
            errorMsg.textContent = '';

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in with Google...';

                const res = await fetch(`${API_URL}/google`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        credential: response.credential
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Google login failed');
                }

                // Use the same session format as normal login
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                window.location.replace('index.html');

            } catch (err) {
                console.error('Google login error:', err);
                errorMsg.textContent = err.message || 'Google login failed';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
            }
        };



        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            if (!window.google?.accounts?.id) {
                errorMsg.textContent = 'Google sign-in is still loading. Please try again.';
                return;
            }

            if (!googleClientId) {
                errorMsg.textContent = 'Google sign-in is still loading. Please try again.';
                return;
            }

            window.google.accounts.id.prompt();

            window.google.accounts.id.prompt();
        });


        passwordToggle.addEventListener('click', () => {

            const isHidden = passwordInput.type === 'password';

            passwordInput.type = isHidden ? 'text' : 'password';

            passwordToggle.innerHTML = isHidden
                ? `
          <svg class="eye-icon" viewBox="0 0 24 24"
               fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3 3l18 18"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M10.6 6.2C11.05 6.08 11.52 6 12 6
                 c6.5 0 10 6 10 6
                 a18.4 18.4 0 0 1-3.05 3.45"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M6.1 9.1C3.7 10.55 2 12 2 12
                 s3.5 6 10 6
                 c1.05 0 2.02-.16 2.9-.43"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        `
                : `
          <svg class="eye-icon" viewBox="0 0 24 24"
               fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle
              cx="12"
              cy="12"
              r="2.5"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
        `;

            passwordToggle.setAttribute(
                'aria-label',
                isHidden ? 'Hide password' : 'Show password'
            );
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            const email =
                document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Login failed');
                }

                // Save token to localStorage
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Redirect to main app
                window.location.href = 'index.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
            }
        });


        window.addEventListener('load', () => {
            if (window.google?.accounts?.id) {
                loadGoogleConfiguration();
            } else {
                document.querySelector(
                    'script[src="https://accounts.google.com/gsi/client"]'
                )?.addEventListener('load', loadGoogleConfiguration, { once: true });
            }
        });
    </script>
</body>

</html>
