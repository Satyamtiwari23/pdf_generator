<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — PDFnest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <script src="auth-guard.js"></script>
    <script src="theme.js"></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome back</h2>
            <p class="subtitle">Log in to access your PDF tools.</p>

            <form id="loginForm">
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="youremail@example.com" required />
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required />

                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="forgot-password">
                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">Log In</button>
                <div class="error-msg" id="errorMsg"></div>
            </form>

            <!-- Google Login -->
            <div class="google-login-section">
                <div class="google-divider">
                    <span>OR</span>
                </div>

                <a href="https://pdf-generator-ochre-two.vercel.app/api/auth/google?mode=login"
                    class="google-auth-button" aria-label="Continue with Google">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z" />
                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.27 5.64c4.25-3.93 7.5-9.72 7.5-17.29Z" />
                        <path fill="#FBBC05"
                            d="M10.54 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24 24 0 0 0 0 21.56l7.98-6.19Z" />
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.91-5.81l-7.27-5.64c-2.02 1.35-4.6 2.15-8.64 2.15-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z" />
                    </svg>
                    <span>Continue with Google</span>
                </a>
            </div>


            <div class="auth-switch">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://pdf-generator-ochre-two.vercel.app/api/auth';
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');

        // Complete Google OAuth after returning from the backend.
        async function completeGoogleLogin() {
            const params = new URLSearchParams(window.location.search);

            const ticket = params.get('google_ticket');
            const googleError = params.get('google_error');

            if (googleError) {
                errorMsg.textContent = 'Google login failed. Please try again.';
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            if (!ticket) return;

            errorMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Completing Google login...';

            try {
                const response = await fetch(`${API_URL}/google/exchange`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ticket })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Google login failed.');
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                window.history.replaceState({}, document.title, window.location.pathname);
                window.location.replace('index.html');

            } catch (error) {
                console.error('Google login completion error:', error);
                errorMsg.textContent = error.message;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        completeGoogleLogin();



        passwordToggle.addEventListener('click', () => {

            const isHidden = passwordInput.type === 'password';

            passwordInput.type = isHidden ? 'text' : 'password';

            passwordToggle.innerHTML = isHidden
                ? `
          <svg class="eye-icon" viewBox="0 0 24 24"
               fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3 3l18 18"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M10.6 6.2C11.05 6.08 11.52 6 12 6
                 c6.5 0 10 6 10 6
                 a18.4 18.4 0 0 1-3.05 3.45"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M6.1 9.1C3.7 10.55 2 12 2 12
                 s3.5 6 10 6
                 c1.05 0 2.02-.16 2.9-.43"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        `
                : `
          <svg class="eye-icon" viewBox="0 0 24 24"
               fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle
              cx="12"
              cy="12"
              r="2.5"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
        `;

            passwordToggle.setAttribute(
                'aria-label',
                isHidden ? 'Hide password' : 'Show password'
            );
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            const email =
                document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Login failed');
                }

                // Save token to localStorage
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Redirect to main app
                window.location.href = 'index.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
            }
        });
    </script>
</body>

</html>
