<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit PDF — PDFnest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Open+Sans:wght@400;700&family=Roboto:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
  <script src="auth-guard.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <style>
    .tbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 10px;
      margin: 0 0 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .08)
    }

    .tbar .tb {
      padding: 7px 11px;
      border: 1px solid #d5d5dd;
      background: #fafafc;
      color: #222;
      border-radius: 8px;
      font: 600 13px 'Plus Jakarta Sans', sans-serif;
      cursor: pointer
    }

    .tbar .tb:hover {
      background: #eef
    }

    .tbar .tb.on {
      background: #5b4bff;
      color: #fff;
      border-color: #5b4bff
    }

    .tbar .tb:disabled {
      opacity: .4;
      cursor: default
    }

    .tbar .sep {
      width: 1px;
      height: 24px;
      background: #ddd;
      margin: 0 4px
    }

    .tbar .zl {
      min-width: 48px;
      text-align: center;
      font: 600 13px sans-serif;
      color: #222
    }

    #props {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding-top: 8px;
      border-top: 1px dashed #ddd;
      font: 13px sans-serif;
      color: #222
    }

    #props[hidden] {
      display: none
    }

    #props label {
      display: flex;
      gap: 5px;
      align-items: center
    }

    #props input[type=number] {
      width: 60px
    }

    .ws {
      background: #8d8fa3;
      border-radius: 12px;
      padding: 20px 8px;
      overflow: auto;
      max-height: 80vh;
      text-align: center
    }

    .pg {
      position: relative;
      display: inline-block;
      margin: 0 auto 18px;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
      text-align: left;
      vertical-align: top
    }

    .pg canvas {
      display: block
    }

    .ol,
    .txl {
      position: absolute;
      inset: 0
    }

    .txl {
      pointer-events: none
    }

    .txl.on {
      pointer-events: auto
    }

    .tx {
      position: absolute;
      cursor: pointer
    }

    .tx:hover {
      background: rgba(91, 75, 255, .22);
      outline: 1px solid #5b4bff
    }

    .crosshair .pg {
      cursor: crosshair
    }

    .obj {
      position: absolute;
      box-sizing: border-box;
      cursor: move;
      touch-action: none
    }

    .obj.sel {
      outline: 1.5px solid #5b4bff
    }

    .obj:hover {
      outline: 1px dashed #5b4bff
    }

    .obj .b {
      white-space: pre;
      line-height: 1.2;
      outline: none;
      min-width: 12px;
      padding: 0;
      margin: 0
    }

    .obj.img img {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none
    }

    /* =========================================================
   8 RESIZE HANDLES
   ========================================================= */

    .obj .h {
      display: none;
      position: absolute;
      width: 10px;
      height: 10px;
      background: #5b4bff;
      border: 2px solid #fff;
      border-radius: 50%;
      box-sizing: border-box;
      z-index: 20;
    }

    .obj.sel .h {
      display: block;
    }

    /* Corners */
    .obj .h.nw {
      left: -6px;
      top: -6px;
      cursor: nwse-resize;
    }

    .obj .h.ne {
      right: -6px;
      top: -6px;
      cursor: nesw-resize;
    }

    .obj .h.se {
      right: -6px;
      bottom: -6px;
      cursor: nwse-resize;
    }

    .obj .h.sw {
      left: -6px;
      bottom: -6px;
      cursor: nesw-resize;
    }

    /* Middle handles */
    .obj .h.n {
      left: 50%;
      top: -6px;
      transform: translateX(-50%);
      cursor: ns-resize;
    }

    .obj .h.e {
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      cursor: ew-resize;
    }

    .obj .h.s {
      left: 50%;
      bottom: -6px;
      transform: translateX(-50%);
      cursor: ns-resize;
    }

    .obj .h.w {
      left: -6px;
      top: 50%;
      transform: translateY(-50%);
      cursor: ew-resize;
    }

    .pgt {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 3px;
      opacity: 0;
      transition: .15s;
      z-index: 5
    }

    .pg:hover .pgt {
      opacity: 1
    }

    .pgt button {
      border: 0;
      border-radius: 6px;
      background: rgba(30, 30, 40, .88);
      color: #fff;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px
    }

    .obj.path .h {
      display: none !important
    }

    .obj.path {
      min-width: 8px;
      min-height: 8px
    }

    .obj.path svg {
      position: absolute;
      left: 0;
      top: 0;
      overflow: visible;
      pointer-events: none
    }

    .obj.rect.e {
      border-radius: 50%
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand"><span class="logo">✦</span><span>PDFnest<small>Edit PDF</small></span></a>
      <a href="index.html" class="back-link">← All tools</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Edit your <span class="grad">PDF</span></h1>
      <p>Existing text edit ya delete karo, naya text aur images add karo, opacity, zoom, undo — sab kuch browser me.
      </p>
    </section>

    <section class="card" id="upCard">
      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <div class="dz-icon">✏️</div>
        <div class="dz-title">Drag &amp; drop a PDF here</div>
        <div class="dz-sub">or <span class="link">browse files</span></div>
      </div>
    </section>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />
    <input type="file" id="imgInput" accept="image/*" hidden />
    <input type="file" id="addPdf" accept="application/pdf" hidden />

    <section id="edSec" hidden style="margin-top:8px">
      <div class="tbar" id="tbar">
        <button class="tb" id="bOpen">📂 Open</button>
        <button class="tb" id="bUndo">↶</button><button class="tb" id="bRedo">↷</button>
        <span class="sep"></span>
        <button class="tb on" data-tool="select">↖ Select</button>
        <button class="tb" id="bEdit" title="Click any existing text to edit/delete it">✎ Edit existing text</button>
        <button class="tb" data-tool="text">T Text</button>
        <button class="tb" id="bImg">🖼 Image</button>
        <button class="tb" data-tool="erase" title="Drag over anything to erase it">▭ Erase</button>
        <button class="tb" data-tool="rect">■ Box</button><button class="tb" data-tool="ellipse">●
          Circle</button><button class="tb" data-tool="hl">🖍 Highlight</button><button class="tb" data-tool="pen">✍
          Draw / Sign</button><button class="tb" data-tool="line">╱ Line</button><button class="tb" data-tool="arrow">➜
          Arrow</button>
        <span class="sep"></span>
        <button class="tb" id="zo">−</button><span class="zl" id="zl">100%</span><button class="tb" id="zi">+</button>
        <button class="tb" id="zf">Fit</button><span class="sep"></span><button class="tb" id="bWm">💧
          Watermark</button><button class="tb" id="bPn">№ Page numbers</button><button class="tb" id="bAdd">＋ Add /
          merge PDF</button>
        <span class="sep"></span>
        <button class="tb on" id="bExport" style="background:#5b4bff;color:#fff">⬇ Export PDF</button>
        <div id="props" hidden>
          <select id="fFont">
            <option value="Helvetica">Arial / Helvetica</option>
            <option value="Times">Times New Roman</option>
            <option value="Courier">Courier New</option>

            <option value="Georgia">Georgia</option>
            <option value="Verdana">Verdana</option>
            <option value="Trebuchet">Trebuchet MS</option>

            <option value="Roboto">Roboto</option>
            <option value="OpenSans">Open Sans</option>
            <option value="Montserrat">Montserrat</option>
            <option value="NotoSans">Noto Sans</option>

            <option value="Unicode">Noto Sans Devanagari / Hindi</option>
          </select>
          <label class="tx-only">Size <input type="number" id="fSize" min="4" max="200" /></label>
          <button class="tb tx-only" id="fB"><b>B</b></button><button class="tb tx-only"
            id="fI"><i>I</i></button><button class="tb tx-only" id="fU"><u>U</u></button><button class="tb tx-only"
            id="fS"><s>S</s></button>
          <label id="colL"><span id="colT">Color</span> <input type="color" id="fColor" /></label>
          <label>Opacity <input type="range" id="fOp" min="5" max="100" /> <span id="opT">100%</span></label>
          <label class="sw-only">Border <input type="color" id="fSc" class="rc-only"> <input type="number" id="fSw"
              min="0" max="40"></label><label class="rc-only"><input type="checkbox" id="fFill"> Fill</label><button
            class="tb" id="fFront">⬆ Front</button><button class="tb" id="fBack">⬇ Back</button><button class="tb"
            id="fDup">⧉ Duplicate</button>
          <button class="tb" id="fDel">🗑 Delete</button>
        </div>
      </div>
      <div class="ws" id="ws">
        <div id="pages"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">Powered by pdf.js + pdf-lib · Files never leave your device.</footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';
      const $ = (s, c = document) => c.querySelector(s);
      const $$ = (s, c = document) => Array.from(c.querySelectorAll(s));
      const uid = () => Math.random().toString(36).slice(2, 9);
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      let tt; function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), 2600); }

      const S = { buf: null, name: '', pdf: null, meta: [], items: [], objs: [], sel: null, tool: 'select', edit: false, zoom: 1, hist: [], redo: [], tok: 0 };
      const IMG = {};
      const K = () => 1.333 * S.zoom;
      const FCSS = {
        Helvetica: 'Arial, Helvetica, sans-serif',
        Times: '"Times New Roman", Times, serif',
        Courier: '"Courier New", Courier, monospace',

        Georgia: 'Georgia, serif',
        Verdana: 'Verdana, sans-serif',
        Trebuchet: '"Trebuchet MS", sans-serif',

        Roboto: 'Roboto, sans-serif',
        OpenSans: '"Open Sans", sans-serif',
        Montserrat: 'Montserrat, sans-serif',
        NotoSans: '"Noto Sans", sans-serif',

        Unicode: '"Noto Sans Devanagari", "Noto Sans", sans-serif'
      };
      const FPDF = { Helvetica: ['Helvetica', 'Bold', 'Oblique', 'BoldOblique'], Times: ['TimesRoman', 'Bold', 'Italic', 'BoldItalic'], Courier: ['Courier', 'Bold', 'Oblique', 'BoldOblique'] };
      const get = id => S.objs.find(o => o.id === id);
      const pgEl = i => $('.pg[data-i="' + i + '"]');
      const elOf = id => $('.obj[data-id="' + id + '"]');

      /* ---------- history ---------- */
      function commit() { S.hist.push(JSON.stringify(S.objs)); if (S.hist.length > 60) S.hist.shift(); S.redo = []; btns(); }
      function restore(json) { S.objs = JSON.parse(json); S.sel = null; mountAll(); syncProps(); btns(); }
      function undo() { if (S.hist.length > 1) { S.redo.push(S.hist.pop()); restore(S.hist[S.hist.length - 1]); } }
      function redo() { if (S.redo.length) { const j = S.redo.pop(); S.hist.push(j); restore(j); } }
      function btns() { $('#bUndo').disabled = S.hist.length < 2; $('#bRedo').disabled = !S.redo.length; }

      /* ---------- load & render ---------- */
      async function loadPdf(files) {
        const f = Array.from(files).find(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
        if (!f) return toast('Please choose a PDF');
        await openBytes(await f.arrayBuffer(), f.name);
      }
      async function openBytes(buf, name) {
        try {
          S.buf = buf; S.name = name || S.name;
          S.pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
          S.meta = []; S.items = []; S.objs = []; S.sel = null; S.hist = ['[]']; S.redo = [];
          for (let i = 1; i <= S.pdf.numPages; i++) {
            const p = await S.pdf.getPage(i), vp = p.getViewport({ scale: 1 });
            S.meta.push({ w: vp.width, h: vp.height });
            const c = await p.getTextContent(); S.items.push({ list: c.items.filter(t => t.str && t.str.trim()), styles: c.styles });
          }
          $('#upCard').hidden = true; $('#edSec').hidden = false; syncProps(); btns();
          await renderAll();
        } catch (e) { console.error(e); toast('Could not read that PDF'); }
      }

      async function renderAll() {
        const tok = ++S.tok, k = K(), dpr = window.devicePixelRatio || 1, box = $('#pages'); box.innerHTML = '';
        for (let i = 0; i < S.pdf.numPages; i++) {
          const page = await S.pdf.getPage(i + 1); if (tok !== S.tok) return;
          const vp = page.getViewport({ scale: k });
          const pg = document.createElement('div'); pg.className = 'pg'; pg.dataset.i = i;
          pg.style.width = vp.width + 'px'; pg.style.height = vp.height + 'px';
          const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
          cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
          const ol = document.createElement('div'); ol.className = 'ol';
          const tl = document.createElement('div'); tl.className = 'txl' + (S.edit ? ' on' : '');
          pg.append(cv, tl, ol); box.appendChild(pg);
          pg.insertAdjacentHTML('beforeend', '<div class="pgt"><button data-op="up" title="Move up">↑</button><button data-op="dn" title="Move down">↓</button><button data-op="rotl" title="Rotate left">⟲</button><button data-op="rot" title="Rotate right">⟳</button><button data-op="blank" title="Insert blank page after">＋</button><button data-op="del" title="Delete page">🗑</button></div>');
          await page.render({ canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
          if (tok !== S.tok) return;
          const H = S.meta[i].h;
          S.items[i].list.forEach(it => {
            const size = Math.hypot(it.transform[0], it.transform[1]), d = document.createElement('div'); d.className = 'tx';
            d.style.cssText = `left:${it.transform[4] * k}px;top:${(H - it.transform[5] - size * .9) * k}px;width:${it.width * k}px;height:${size * 1.2 * k}px`;
            d.addEventListener('click', ev => { ev.stopPropagation(); convertItem(i, it, S.items[i].styles, d); });
            tl.appendChild(d);
          });
          S.objs.filter(o => o.page === i).forEach(mount);
        }
        if (S.sel) select(S.sel);
      }
      function mountAll() { $$('.ol').forEach(l => l.innerHTML = ''); S.objs.forEach(mount); if (S.sel) select(S.sel); }

      /* ---------- objects ---------- */
      function mount(o) {
        const pg = pgEl(o.page);
        if (!pg) return;

        const el = document.createElement('div');
        el.className = 'obj ' + o.t;
        el.dataset.id = o.id;

        if (o.t === 'text') {

          const b = document.createElement('div');
          b.className = 'b';
          b.textContent = o.text;

          el.appendChild(b);

          b.addEventListener('input', () => {
            o.text = b.innerText.replace(/\n$/, '');
            ensureTextBoxFits(o);
            refresh(o);
          });

          b.addEventListener('blur', () => {
            b.contentEditable = 'false';

            ensureTextBoxFits(o);

            if (
              JSON.stringify(S.objs) !==
              S.hist[S.hist.length - 1]
            ) {
              commit();
            }
          });

          el.addEventListener('dblclick', () => {
            editText(o.id);
          });
        }

        else if (o.t === 'img') {

          const im = document.createElement('img');

          im.src = IMG[o.img].url;

          el.appendChild(im);
        }

        /* =========================================================
           8 RESIZE HANDLES
           ========================================================= */

        const handles = [
          'nw', 'n', 'ne',
          'e',
          'se', 's', 'sw',
          'w'
        ];

        handles.forEach(dir => {

          const h = document.createElement('div');

          h.className = 'h ' + dir;

          h.dataset.dir = dir;

          h.addEventListener('pointerdown', e => {
            startResize(e, o, dir);
          });

          el.appendChild(h);
        });

        el.addEventListener('pointerdown', e => {

          if (e.target.classList.contains('h')) {
            return;
          }

          if (e.target.isContentEditable) {
            return;
          }

          e.stopPropagation();

          select(o.id);

          startDrag(e, o);
        });

        pg.querySelector('.ol').appendChild(el);

        refresh(o);
      }
      function arrow(o) {
        const p = o.pts, a = p[p.length - 2], b = p[p.length - 1], t = Math.atan2(b[1] - a[1], b[0] - a[0]), L = 6 + o.sw * 3;
        return [[b[0] - L * Math.cos(t - .45), b[1] - L * Math.sin(t - .45)], b, [b[0] - L * Math.cos(t + .45), b[1] - L * Math.sin(t + .45)]];
      }
      function fit(o, p) {
        const xs = p.map(q => q[0]), ys = p.map(q => q[1]), mx = Math.min(...xs), my = Math.min(...ys);
        o.x = mx; o.y = my; o.w = Math.max(1, Math.max(...xs) - mx); o.h = Math.max(1, Math.max(...ys) - my); o.pts = p.map(q => [q[0] - mx, q[1] - my]);
      }

      function getTextMetrics(o) {

        const canvas =
          document.createElement('canvas');

        const ctx =
          canvas.getContext('2d');

        const weight =
          o.b ? '700' : '400';

        const style =
          o.i ? 'italic' : 'normal';

        ctx.font =
          `${style} ${weight} ${o.size}px ${FCSS[o.font] || FCSS.Helvetica
          }`;

        const lines =
          String(o.text || 'Type here').split('\n');

        let width = 20;

        lines.forEach(line => {

          width = Math.max(
            width,
            ctx.measureText(line).width
          );

        });

        return {
          width,
          height:
            Math.max(1, lines.length) *
            o.size *
            1.2
        };
      }


      function ensureTextBoxFits(o) {

        if (o.t !== 'text') return;

        const m = getTextMetrics(o);

        /*
          Only enlarge the box when the font/content
          would touch or exceed the current border.
      
          Never shrink the existing box automatically.
        */

        if (!o.w || m.width + 6 > o.w) {
          o.w = m.width + 6;
        }

        if (!o.h || m.height + 4 > o.h) {
          o.h = m.height + 4;
        }
      }


      function refresh(o) {

        const el = elOf(o.id);

        if (!el) return;

        const k = K();

        el.style.left = o.x * k + 'px';
        el.style.top = o.y * k + 'px';
        el.style.opacity = o.op;

        /* =========================================================
           TEXT
           ========================================================= */

        if (o.t === 'text') {

          const b = el.firstChild;

          /*
            Old text objects may not have width/height.
            Give them a sensible initial box.
          */

          if (!o.w || !o.h) {
            const metrics = getTextMetrics(o);

            o.w = Math.max(
              o.w || 0,
              metrics.width + 6
            );

            o.h = Math.max(
              o.h || 0,
              metrics.height + 4
            );
          }

          el.style.width = o.w * k + 'px';
          el.style.height = o.h * k + 'px';

          b.style.width = '100%';
          b.style.height = '100%';

          b.style.fontSize =
            o.size * k + 'px';

          b.style.color =
            o.color;

          b.style.fontFamily =
            FCSS[o.font] || FCSS.Helvetica;

          b.style.fontWeight =
            o.b ? 700 : 400;

          b.style.fontStyle =
            o.i ? 'italic' : 'normal';

          b.style.textDecoration =
            [
              o.u && 'underline',
              o.s && 'line-through'
            ]
              .filter(Boolean)
              .join(' ') || 'none';

          b.style.whiteSpace = 'pre-wrap';
          b.style.overflow = 'hidden';

          return;
        }

        /* =========================================================
           OTHER OBJECTS
           ========================================================= */

        el.style.width =
          o.w * k + 'px';

        el.style.height =
          o.h * k + 'px';

        if (o.t === 'rect') {

          el.classList.toggle(
            'e',
            o.k === 'e'
          );

          el.style.background =
            o.fill === false
              ? 'transparent'
              : o.color;

          el.style.border =
            o.sw > 0
              ? o.sw * k + 'px solid ' + o.sc
              : '0';
        }

        if (o.t === 'path') {

          el.querySelector('svg')?.remove();

          const pl = a =>
            `<polyline points="${a.map(
              p => p[0] * k + ',' + p[1] * k
            ).join(' ')}"
      fill="none"
      stroke="${o.color}"
      stroke-width="${o.sw * k}"
      stroke-linecap="round"
      stroke-linejoin="round"/>`;

          el.insertAdjacentHTML(

      const dz = $('#dropzone'), fi = $('#fileInput');
      dz.onclick = () => fi.click();
      dz.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } };
      fi.onchange = () => { loadPdf(fi.files); fi.value = ''; };
      ['dragenter', 'dragover'].forEach(v => dz.addEventListener(v, e => { e.preventDefault(); dz.classList.add('dragover'); }));
      ['dragleave', 'drop'].forEach(v => dz.addEventListener(v, e => { e.preventDefault(); dz.classList.remove('dragover'); }));
      dz.addEventListener('drop', e => { if (e.dataTransfer.files.length) loadPdf(e.dataTransfer.files); });
      ['dragover', 'drop'].forEach(v => addEventListener(v, e => { if (!e.target.closest('#dropzone')) e.preventDefault(); }));
    })();
  </script>
</body>

</html>
