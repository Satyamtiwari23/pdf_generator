<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — PDFnest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Create an account</h2>
      <p class="subtitle">Join PDFnest to start generating documents.</p>
      
      <form id="signupForm">
        <div class="auth-field">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="john@example.com" required />
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="6" />
        </div>
        <button type="submit" class="auth-btn" id="submitBtn">Sign Up</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://pdf-generator-flax.vercel.app/api/auth';
    const form = document.getElementById('signupForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_URL}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.message || 'Signup failed');
        }

        // Save token to localStorage
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // Redirect to main app
        window.location.href = 'index.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
