<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign Up — PDFnest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <script src="theme.js"></script>
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <h2>Create an account</h2>

      <p class="subtitle">
        Join PDFnest to start generating documents.
      </p>


      <form id="signupForm">

        <!-- =========================
             NAME
        ========================== -->

        <div class="auth-field">

          <label for="name">Full Name</label>

          <input type="text" id="name" placeholder="Your Name" required />

        </div>


        <!-- =========================
             EMAIL
        ========================== -->

        <div class="auth-field">

          <label for="email">Email</label>

          <input type="email" id="email" placeholder="youremail@example.com" required />

        </div>


        <!-- =========================
             PASSWORD
        ========================== -->

        <div class="auth-field">

          <label for="password">Password</label>

          <div class="password-wrapper">

            <input type="password" id="password" placeholder="••••••••" required minlength="8" maxlength="64"
              autocomplete="new-password" />

            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">

              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" />

                <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8" />

              </svg>

            </button>

          </div>

        </div>
        <div id="passwordMessage" class="password-message"></div>


        <!-- =========================
             CONFIRM PASSWORD
        ========================== -->

        <div class="auth-field">

          <label for="confirmPassword">Confirm Password</label>

          <div class="password-wrapper">

            <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="8" maxlength="64"
              autocomplete="new-password" />
            <button type="button" class="password-toggle" id="confirmPasswordToggle" aria-label="Show password">

              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" />

                <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8" />

              </svg>

            </button>

          </div>

        </div>





        <!-- =========================
             SUBMIT
        ========================== -->

        <button type="submit" class="auth-btn" id="submitBtn">
          Sign Up
        </button>

        <div class="error-msg" id="errorMsg"></div>

      </form>

      <!-- Google Signup -->
      <div class="google-login-section">
        <div class="google-divider">
          <span>OR</span>
        </div>

        <a href="https://pdf-generator-ochre-two.vercel.app/api/auth/google?mode=signup" class="google-auth-button"
          aria-label="Sign up with Google">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z" />
            <path fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.27 5.64c4.25-3.93 7.5-9.72 7.5-17.29Z" />
            <path fill="#FBBC05" d="M10.54 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24 24 0 0 0 0 21.56l7.98-6.19Z" />
            <path fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.91-5.81l-7.27-5.64c-2.02 1.35-4.6 2.15-8.64 2.15-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z" />
          </svg>
          <span>Continue with Google</span>
        </a>
      </div>


      <div class="auth-switch">

        Already have an account?
        <a href="login.html">Log in</a>

      </div>

    </div>

  </div>


  <script>

    const API_URL =
      'https://pdf-generator-ochre-two.vercel.app/api/auth';


    const form =
      document.getElementById('signupForm');

    const errorMsg =
      document.getElementById('errorMsg');

    const submitBtn =
      document.getElementById('submitBtn');


    // Complete Google OAuth after returning from the backend.
    async function completeGoogleSignup() {
      const params = new URLSearchParams(window.location.search);

      const ticket = params.get('google_ticket');
      const googleError = params.get('google_error');

      if (googleError) {
        errorMsg.textContent = 'Google signup failed. Please try again.';
        window.history.replaceState({}, document.title, window.location.pathname);
        return;
      }

      if (!ticket) return;

      errorMsg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Completing Google signup...';

      try {
        const response = await fetch(`${API_URL}/google/exchange`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ticket })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Google signup failed.');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        window.history.replaceState({}, document.title, window.location.pathname);
        window.location.replace('index.html');

      } catch (error) {
        console.error('Google signup completion error:', error);
        errorMsg.textContent = error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign Up';
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    completeGoogleSignup();


    const passwordInput =
      document.getElementById('password');

    const confirmPasswordInput =
      document.getElementById('confirmPassword');

    const passwordToggle =
      document.getElementById('passwordToggle');

    const confirmPasswordToggle =
      document.getElementById('confirmPasswordToggle');


    const passwordMessage =
      document.getElementById('passwordMessage');

    // Google authentication callback



    function validatePassword(password) {

      if (password.length < 8) {
        return {
          valid: false,
          message: 'Password must be at least 8 characters.'
        };
      }

      if (password.length > 64) {
        return {
          valid: false,
          message: 'Password must not exceed 64 characters.'
        };
      }

      if (!/[A-Z]/.test(password)) {
        return {
          valid: false,
          message: 'Password must contain at least one uppercase letter.'
        };
      }

      if (!/[a-z]/.test(password)) {
        return {
          valid: false,
          message: 'Password must contain at least one lowercase letter.'
        };
      }

      if (!/[0-9]/.test(password)) {
        return {
          valid: false,
          message: 'Password must contain at least one number.'
        };
      }

      if (!/[^A-Za-z0-9\s]/.test(password)) {
        return {
          valid: false,
          message: 'Password must contain at least one special character.'
        };
      }

      return {
        valid: true,
        message: 'Strong password — all requirements are met.'
      };
    }



    passwordInput?.addEventListener('input', function () {

      const result =
        validatePassword(passwordInput.value);

      if (!passwordInput.value) {
        passwordMessage.textContent = '';
        passwordMessage.className = 'password-message';
        return;
      }

      passwordMessage.textContent =
        result.message;

      passwordMessage.className =
        result.valid
          ? 'password-message success'
          : 'password-message error';

    });



    /* ==========================================================
       EYE ICON
    ========================================================== */

    function eyeOpenSVG() {

      return `
        <svg
          class="eye-icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle
            cx="12"
            cy="12"
            r="2.5"
            stroke="currentColor"
            stroke-width="1.8"
          />

        </svg>
      `;

    }


    function eyeClosedSVG() {

      return `
        <svg
          class="eye-icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            d="M3 3l18 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M10.6 6.2C11.05 6.08 11.52 6 12 6
               c6.5 0 10 6 10 6
               a18.4 18.4 0 0 1-3.05 3.45"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M6.1 9.1C3.7 10.55 2 12 2 12
               s3.5 6 10 6
               c1.05 0 2.02-.16 2.9-.43"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

        </svg>
      `;

    }


    /* ==========================================================
       PASSWORD VISIBILITY
    ========================================================== */

    function setupPasswordToggle(
      input,
      button
    ) {

      button.addEventListener('click', function () {

        const isHidden =
          input.type === 'password';


        input.type =
          isHidden ? 'text' : 'password';


        button.innerHTML =
          isHidden
            ? eyeClosedSVG()
            : eyeOpenSVG();


        button.setAttribute(
          'aria-label',
          isHidden
            ? 'Hide password'
            : 'Show password'
        );

      });

    }


    setupPasswordToggle(
      passwordInput,
      passwordToggle
    );


    setupPasswordToggle(
      confirmPasswordInput,
      confirmPasswordToggle
    );


    /* ==========================================================
       SIGNUP
    ========================================================== */

    form.addEventListener(
      'submit',
      async function (e) {

        e.preventDefault();

        errorMsg.textContent = '';


        const name =
          document.getElementById('name').value.trim();

        const email =
          document.getElementById('email').value.trim();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        // ------------------------------------------
        // PASSWORD VALIDATION
        // ------------------------------------------

        const passwordResult =
          validatePassword(password);

        if (!passwordResult.valid) {

          passwordMessage.textContent =
            passwordResult.message;

          passwordMessage.className =
            'password-message error';

          return;
        }


        // ------------------------------------------
        // PASSWORD MATCH CHECK
        // ------------------------------------------

        if (password !== confirmPassword) {

          errorMsg.textContent =
            'Passwords do not match.';

          return;
        }


        submitBtn.disabled = true;

        submitBtn.textContent =
          'Creating account...';


        try {

          const res =
            await fetch(
              `${API_URL}/signup`,
              {
                method: 'POST',

                headers: {
                  'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                  name,
                  email,
                  password
                })
              }
            );


          const data =
            await res.json();


          if (!res.ok) {

            throw new Error(
              data.message || 'Signup failed'
            );

          }


          /* ------------------------------------------
             SAVE AUTH DATA
          ------------------------------------------ */

          localStorage.setItem(
            'token',
            data.token
          );

          localStorage.setItem(
            'user',
            JSON.stringify(data.user)
          );


          /* ------------------------------------------
             REDIRECT
          ------------------------------------------ */

          window.location.href =
            'index.html';


        } catch (err) {

          errorMsg.textContent =
            err.message;

          submitBtn.disabled = false;

          submitBtn.textContent =
            'Sign Up';

        }

      }
    );
  </script>

</body>

</html>
