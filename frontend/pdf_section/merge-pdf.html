<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge PDFs — PDFnest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <script src="../theme.js"></script>
  <script src="../auth-guard.js"></script>
  <script src="../tool-bridge.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>

<body class="has-custom-cursor">

  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="brand">
        <span class="logo">✦</span>
        <span>PDFnest<small>Merge PDFs</small></span>
      </a>
      <a href="../index.html" class="back-link">← All tools</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Merge <span class="grad">multiple PDFs</span> into one</h1>
      <p>Drop in your PDFs, drag to reorder, and combine them into a single document.</p>
    </section>

    <section class="card">
      <div class="field">
        <label>Your PDF files</label>
        <div class="dropzone" id="dropzone" tabindex="0" role="button">
          <div class="dz-icon">📎</div>
          <div class="dz-title">Drag &amp; drop PDFs here</div>
          <div class="dz-sub">or <span class="link">browse files</span> · multiple allowed</div>
        </div>
        <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden />
      </div>

      <div class="file-list" id="fileList"></div>

      <div class="actions">
        <button class="btn btn-primary" id="mergeBtn" disabled>🔗 Merge &amp; download</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">Powered by pdf-lib · Files never leave your device.</footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';
      const $ = (s, c = document) => c.querySelector(s);
      const $$ = (s, c = document) => Array.prototype.slice.call(c.querySelectorAll(s));
      const uid = () => Math.random().toString(36).slice(2, 9);

      let toastTimer = null;
      function toast(m) {
        const el = $('#toast'); el.textContent = m; el.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
      }

      const state = { files: [] }; // { id, name, size, bytes }

      function fmtSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(2) + ' MB';
      }

      async function addFiles(fileList) {
        const files = Array.from(fileList).filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
        if (!files.length) { toast('Please choose PDF files'); return; }
        for (const file of files) {
          try {
            const buf = await file.arrayBuffer();
            // verify it's a PDF
            try { await PDFLib.PDFDocument.load(buf.slice(0)); }
            catch (e) { toast('"' + file.name + '" is not a valid PDF'); continue; }
            state.files.push({ id: uid(), name: file.name, size: file.size, bytes: buf });
          } catch (err) { console.error(err); toast('Could not read "' + file.name + '"'); }
        }
        renderFiles();
      }

      /* ==== Tool Bridge: receive incoming PDF ==== */
      (async function bridgeReceiveIncoming() {
        try {
          if (!window.ToolBridge) return;

          const incoming = await window.ToolBridge.consumeIncoming();
          if (!incoming) return;

          const file = new File([incoming.blob], incoming.fileName, {
            type: incoming.mimeType || incoming.blob.type
          });

          await addFiles([file]);

          try { toast('📥 Received from another tool'); } catch (_) { }
        } catch (err) {
          console.error('[bridge] receive failed:', err);
        }
      })();

      function renderFiles() {
        const list = $('#fileList'); list.innerHTML = '';
        state.files.forEach(f => {
          const el = document.createElement('div');
          el.className = 'file-item';
          el.draggable = true;
          el.dataset.id = f.id;
          el.innerHTML =
            '<span class="file-handle">⠿</span>' +
            '<span class="file-icon">PDF</span>' +
            '<div class="file-info">' +
            '<div class="file-name">' + f.name + '</div>' +
            '<div class="file-size">' + fmtSize(f.size) + '</div>' +
            '</div>' +
            '<button class="remove" data-id="' + f.id + '" aria-label="Remove">✕</button>';
          list.appendChild(el);
        });
        $('#mergeBtn').disabled = state.files.length < 2;
      }

      let dragEl = null;
      function initDrag() {
        const list = $('#fileList');
        list.addEventListener('dragstart', e => {
          const el = e.target.closest('.file-item'); if (!el) return;
          dragEl = el; el.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        list.addEventListener('dragend', () => {
          if (!dragEl) return; dragEl.classList.remove('dragging'); dragEl = null;
          syncOrder();
        });
        list.addEventListener('dragover', e => {
          if (!dragEl) return; e.preventDefault();
          const after = getAfter(list, e.clientY);
          if (after == null) list.appendChild(dragEl);
          else list.insertBefore(dragEl, after);
        });
        list.addEventListener('drop', e => e.preventDefault());
      }
      function getAfter(container, y) {
        const els = $$('.file-item:not(.dragging)', container);
        for (let i = 0; i < els.length; i++) {
          const r = els[i].getBoundingClientRect();
          if (y < r.top + r.height / 2) return els[i];
        }
        return null;
      }
      function syncOrder() {
        const ids = $$('.file-item', $('#fileList')).map(el => el.dataset.id);
        const map = new Map(state.files.map(f => [f.id, f]));
        state.files = ids.map(id => map.get(id)).filter(Boolean);
      }

      async function mergeAndDownload() {
        if (state.files.length < 2) { toast('Add at least two PDFs'); return; }
        const btn = $('#mergeBtn'); btn.disabled = true; btn.textContent = 'Merging…';
        try {
          const { PDFDocument } = PDFLib;
          const out = await PDFDocument.create();
          for (const f of state.files) {
            const src = await PDFDocument.load(f.bytes);
            const pages = await out.copyPages(src, src.getPageIndices());
            pages.forEach(p => out.addPage(p));
          }
          const bytes = await out.save();
          const blob = new Blob([bytes], { type: 'application/pdf' });
          /* ==== Tool Bridge: expose merged PDF ==== */
          if (window.ToolBridge) {
            const footer = document.querySelector('.actions');

            if (footer) {
              window.ToolBridge.injectSendToButton(footer, function () {
                return {
                  blob: blob,
                  fileName:
                    'PDFnest-merged-' +
                    new Date().toISOString().slice(0, 10) +
                    '.pdf',
                  mimeType: 'application/pdf'
                };
              });
            }
          }
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'PDFnest-merged-' + new Date().toISOString().slice(0, 10) + '.pdf';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          toast('Merged PDF downloaded 🎉');
        } catch (err) { console.error(err); toast('Merge failed — try again'); }
        finally { btn.disabled = false; btn.textContent = '🔗 Merge & download'; }
      }

      /* dropzone */
      const dz = $('#dropzone'); const fileInput = $('#fileInput');
      dz.addEventListener('click', () => fileInput.click());
      dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
      fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
      ['dragenter', 'dragover'].forEach(evt => {
        dz.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); dz.classList.add('dragover'); });
      });
      ['dragleave', 'drop'].forEach(evt => {
        dz.addEventListener(evt, e => {
          e.preventDefault(); e.stopPropagation();
          if (evt === 'dragleave' && dz.contains(e.relatedTarget)) return;
          dz.classList.remove('dragover');
        });
      });
      dz.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
      ['dragover', 'drop'].forEach(evt => {
        window.addEventListener(evt, e => { if (!e.target.closest || !e.target.closest('#dropzone')) e.preventDefault(); });
      });

      $('#fileList').addEventListener('click', e => {
        const btn = e.target.closest('.remove'); if (!btn) return;
        state.files = state.files.filter(f => f.id !== btn.dataset.id);
        renderFiles();
      });

      $('#mergeBtn').addEventListener('click', mergeAndDownload);
      initDrag();
    })();

    /* ==========================================================
   CUSTOM CURSOR — user initial OR profile picture
   ========================================================== */
    (function initCustomCursor() {
      // Only run on pages that opted-in via body.has-custom-cursor
      if (!document.body.classList.contains('has-custom-cursor')) return;

      // Don't run on touch devices
      if (window.matchMedia('(hover: none), (pointer: coarse)').matches) return;

      /* --------------------------------------------------------
         Build the avatar content from localStorage
         - If profilePicture is set → show the image
         - Otherwise → show the first letter of the name
         -------------------------------------------------------- */
      function getAvatarHTML() {
        let u = null;
        try {
          u = JSON.parse(localStorage.getItem('user') || 'null');
        } catch (err) {
          u = null;
        }

        const hasPicture =
          u &&
          typeof u.profilePicture === 'string' &&
          u.profilePicture.startsWith('data:image/');

        if (hasPicture) {
          // Escape the src just in case (data URLs are safe, but be tidy)
          const safeSrc = u.profilePicture.replace(/"/g, '&quot;');
          return '<img class="cursor-avatar-img" src="' + safeSrc + '" alt="" />';
        }

        const initial =
          u && u.name && u.name.trim()
            ? u.name.trim().charAt(0).toUpperCase()
            : '✦';

        return initial;
      }

      /* --------------------------------------------------------
         Create the cursor elements
         -------------------------------------------------------- */
      const cursor = document.createElement('div');
      cursor.className = 'custom-cursor';

      const avatarEl = document.createElement('div');
      avatarEl.className = 'cursor-avatar';
      avatarEl.innerHTML = getAvatarHTML();

      cursor.appendChild(avatarEl);
      document.body.appendChild(cursor);

      const ring = document.createElement('div');
      ring.className = 'cursor-ring';
      document.body.appendChild(ring);

      /* --------------------------------------------------------
         Expose a global so other parts of the app can refresh
         the cursor after the profile picture changes.
         -------------------------------------------------------- */
      window.refreshCustomCursorAvatar = function () {
        avatarEl.innerHTML = getAvatarHTML();
      };

      /* --------------------------------------------------------
         Auto-refresh when the header avatar changes
         (fires when renderProfile() updates it)
         -------------------------------------------------------- */
      const headerAvatar = document.getElementById('profileAvatar');
      if (headerAvatar && typeof MutationObserver !== 'undefined') {
        const obs = new MutationObserver(function () {
          window.refreshCustomCursorAvatar();
        });
        obs.observe(headerAvatar, {
          attributes: true,
          attributeFilter: ['src', 'style']
        });
      }

      /* --------------------------------------------------------
         Movement tracking
         -------------------------------------------------------- */
      let mx = -100, my = -100;
      let rx = mx, ry = my;
      let moved = false;

      document.addEventListener('mousemove', function (e) {
        mx = e.clientX;
        my = e.clientY;

        if (!moved) {
          moved = true;
          cursor.classList.add('visible');
          ring.classList.add('visible');
        }

        cursor.style.transform =
          'translate3d(' + mx + 'px, ' + my + 'px, 0) translate(-50%, -50%)';
      }, { passive: true });

      document.addEventListener('mouseleave', function () {
        cursor.classList.remove('visible');
        ring.classList.remove('visible');
      });

      document.addEventListener('mouseenter', function () {
        if (moved) {
          cursor.classList.add('visible');
          ring.classList.add('visible');
        }
      });

      /* --------------------------------------------------------
         Trailing ring
         -------------------------------------------------------- */
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!prefersReduced) {
        (function tick() {
          rx += (mx - rx) * 0.18;
          ry += (my - ry) * 0.18;
          ring.style.transform =
            'translate3d(' + rx + 'px, ' + ry + 'px, 0) translate(-50%, -50%)';
          requestAnimationFrame(tick);
        })();
      } else {
        document.addEventListener('mousemove', function () {
          ring.style.transform =
            'translate3d(' + mx + 'px, ' + my + 'px, 0) translate(-50%, -50%)';
        }, { passive: true });
      }

      /* --------------------------------------------------------
         Hover / text-mode / click states
         -------------------------------------------------------- */
      const INTERACTIVE = 'a, button, [role="button"], .tool-card, .section-toggle, .theme-toggle, .profile-btn, .stat';
      const TEXT_INPUTS = 'input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="search"], input[type="tel"], input[type="url"], textarea';

      document.addEventListener('mouseover', function (e) {
        const t = e.target;
        if (!t || !t.closest) return;
        if (t.closest(INTERACTIVE)) cursor.classList.add('hovering');
        if (t.closest(TEXT_INPUTS)) cursor.classList.add('text-mode');
      });

      document.addEventListener('mouseout', function (e) {
        const to = e.relatedTarget;
        if (!to || !to.closest) {
          cursor.classList.remove('hovering', 'text-mode');
          return;
        }
        if (!to.closest(INTERACTIVE)) cursor.classList.remove('hovering');
        if (!to.closest(TEXT_INPUTS)) cursor.classList.remove('text-mode');
      });

      document.addEventListener('mousedown', function () {
        cursor.classList.add('clicking');
      });
      document.addEventListener('mouseup', function () {
        cursor.classList.remove('clicking');
      });
    })();
  </script>
</body>

</html>
