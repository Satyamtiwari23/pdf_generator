<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge PDF + Images — PDFnest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <script src="../theme.js"></script>
  <script src="../auth-guard.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- pdf.js is used to get image dimensions -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body class="has-custom-cursor">

  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="brand">
        <span class="logo">✦</span>
        <span>PDFnest<small>Merge PDF + Images</small></span>
      </a>
      <a href="../index.html" class="back-link">← All tools</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Merge <span class="grad">PDF &amp; Images</span></h1>
      <p>Upload one PDF and multiple images. Drag to reorder them, then combine everything into a single PDF.</p>
    </section>

    <section class="card">
      <div class="field">
        <label>Your files (1 PDF + Images)</label>
        <div class="dropzone" id="dropzone" tabindex="0" role="button">
          <div class="dz-icon">📎</div>
          <div class="dz-title">Drag &amp; drop a PDF and images here</div>
          <div class="dz-sub">or <span class="link">browse files</span> · .pdf, .png, .jpg, .webp</div>
        </div>
        <input type="file" id="fileInput" accept="application/pdf,image/*" multiple hidden />
      </div>

      <div class="file-list" id="fileList"></div>

      <div class="actions">
        <button class="btn btn-primary" id="mergeBtn" disabled>🔗 Merge &amp; download</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">Powered by pdf-lib · Files never leave your device.</footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';
      const $ = (s, c = document) => c.querySelector(s);
      const $$ = (s, c = document) => Array.prototype.slice.call(c.querySelectorAll(s));
      const uid = () => Math.random().toString(36).slice(2, 9);

      let toastTimer = null;
      function toast(m) {
        const el = $('#toast'); el.textContent = m; el.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
      }

      const state = { files: [] }; // { id, type, name, size, bytes, dataUrl, width, height }

      function fmtSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(2) + ' MB';
      }

      async function processImage(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = img.naturalWidth;
              canvas.height = img.naturalHeight;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);
              // Convert to JPEG to ensure compatibility with pdf-lib
              const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
              resolve({
                id: uid(),
                type: 'image',
                name: file.name,
                size: file.size,
                dataUrl: dataUrl,
                width: img.naturalWidth,
                height: img.naturalHeight
              });
            };
            img.onerror = () => reject(new Error('Invalid image'));
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error('Read error'));
          reader.readAsDataURL(file);
        });
      }

      async function addFiles(fileList) {
        const files = Array.from(fileList);
        if (!files.length) return;

        for (const file of files) {
          if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
            try {
              const buf = await file.arrayBuffer();
              await PDFLib.PDFDocument.load(buf.slice(0));
              // Check if we already have a PDF
              if (state.files.some(f => f.type === 'pdf')) {
                toast('Only one PDF allowed. Remove the existing one first.');
                continue;
              }
              state.files.push({
                id: uid(), type: 'pdf', name: file.name, size: file.size, bytes: buf
              });
            } catch (err) {
              console.error(err); toast('"' + file.name + '" is not a valid PDF');
            }
          } else if (file.type.startsWith('image/')) {
            try {
              const imgData = await processImage(file);
              state.files.push(imgData);
            } catch (err) {
              console.error(err); toast('Could not process "' + file.name + '"');
            }
          }
        }
        renderFiles();
      }

      function renderFiles() {
        const list = $('#fileList'); list.innerHTML = '';
        state.files.forEach(f => {
          const el = document.createElement('div');
          el.className = 'file-item';
          el.draggable = true;
          el.dataset.id = f.id;

          let iconHtml = '';
          let infoHtml = '';

          if (f.type === 'pdf') {
            iconHtml = '<span class="file-icon">PDF</span>';
            infoHtml = '<div class="file-name">' + f.name + '</div><div class="file-size">' + fmtSize(f.size) + '</div>';
          } else {
            iconHtml = '<img src="' + f.dataUrl + '" style="width:36px; height:36px; border-radius:8px; object-fit:cover;" />';
            infoHtml = '<div class="file-name">' + f.name + '</div><div class="file-size">' + f.width + '×' + f.height + ' · ' + fmtSize(f.size) + '</div>';
          }

          el.innerHTML =
            '<span class="file-handle">⠿</span>' +
            iconHtml +
            '<div class="file-info">' + infoHtml + '</div>' +
            '<button class="remove" data-id="' + f.id + '" aria-label="Remove">✕</button>';
          list.appendChild(el);
        });
        $('#mergeBtn').disabled = state.files.length === 0;
      }

      let dragEl = null;
      function initDrag() {
        const list = $('#fileList');
        list.addEventListener('dragstart', e => {
          const el = e.target.closest('.file-item'); if (!el) return;
          dragEl = el; el.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        list.addEventListener('dragend', () => {
          if (!dragEl) return; dragEl.classList.remove('dragging'); dragEl = null;
          syncOrder();
        });
        list.addEventListener('dragover', e => {
          if (!dragEl) return; e.preventDefault();
          const after = getAfter(list, e.clientY);
          if (after == null) list.appendChild(dragEl);
          else list.insertBefore(dragEl, after);
        });
        list.addEventListener('drop', e => e.preventDefault());
      }
      function getAfter(container, y) {
        const els = $$('.file-item:not(.dragging)', container);
        for (let i = 0; i < els.length; i++) {
          const r = els[i].getBoundingClientRect();
          if (y < r.top + r.height / 2) return els[i];
        }
        return null;
      }
      function syncOrder() {
        const ids = $$('.file-item', $('#fileList')).map(el => el.dataset.id);
        const map = new Map(state.files.map(f => [f.id, f]));
        state.files = ids.map(id => map.get(id)).filter(Boolean);
      }

      async function mergeAndDownload() {
        if (state.files.length === 0) { toast('Add some files first'); return; }
        const btn = $('#mergeBtn'); btn.disabled = true; btn.textContent = 'Merging…';
        try {
          const { PDFDocument } = PDFLib;
          const out = await PDFDocument.create();

          for (const f of state.files) {
            if (f.type === 'pdf') {
              const src = await PDFDocument.load(f.bytes);
              const pages = await out.copyPages(src, src.getPageIndices());
              pages.forEach(p => out.addPage(p));
            } else {
              // It's an image
              const img = await out.embedJpg(f.dataUrl);
              // Create a page matching the image dimensions (or A4 if you prefer)
              const page = out.addPage([f.width, f.height]);
              page.drawImage(img, { x: 0, y: 0, width: f.width, height: f.height });
            }
          }

          const bytes = await out.save();
          const blob = new Blob([bytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'PDFnest-merged-' + new Date().toISOString().slice(0, 10) + '.pdf';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          toast('Merged PDF downloaded 🎉');
        } catch (err) {
          console.error(err);
          toast('Merge failed — ' + err.message);
        }
        finally { btn.disabled = false; btn.textContent = '🔗 Merge & download'; }
      }

      /* dropzone */
      const dz = $('#dropzone'); const fileInput = $('#fileInput');
      dz.addEventListener('click', () => fileInput.click());
      dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
      fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
      ['dragenter', 'dragover'].forEach(evt => {
        dz.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); dz.classList.add('dragover'); });
      });
      ['dragleave', 'drop'].forEach(evt => {
        dz.addEventListener(evt, e => {
          e.preventDefault(); e.stopPropagation();
          if (evt === 'dragleave' && dz.contains(e.relatedTarget)) return;
          dz.classList.remove('dragover');
        });
      });
      dz.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
      ['dragover', 'drop'].forEach(evt => {
        window.addEventListener(evt, e => { if (!e.target.closest || !e.target.closest('#dropzone')) e.preventDefault(); });
      });

      $('#fileList').addEventListener('click', e => {
        const btn = e.target.closest('.remove'); if (!btn) return;
        state.files = state.files.filter(f => f.id !== btn.dataset.id);
        renderFiles();
      });

      $('#mergeBtn').addEventListener('click', mergeAndDownload);
      initDrag();
    })();

    /* ==========================================================
   CUSTOM CURSOR — user initial badge that follows the mouse
   ========================================================== */
    (function initCustomCursor() {
      // Don't run on touch devices
      if (window.matchMedia('(hover: none), (pointer: coarse)').matches) return;

      // Read user initial from localStorage
      const user = JSON.parse(localStorage.getItem('user') || 'null');
      const initial = (user && user.name && user.name.trim())
        ? user.name.trim().charAt(0).toUpperCase()
        : '✦';

      // Create the cursor elements
      const cursor = document.createElement('div');
      cursor.className = 'custom-cursor';
      cursor.innerHTML = '<div class="cursor-avatar">' + initial + '</div>';
      document.body.appendChild(cursor);

      const ring = document.createElement('div');
      ring.className = 'cursor-ring';
      document.body.appendChild(ring);

      let mx = -100, my = -100;
      let rx = mx, ry = my;
      let moved = false;

      // Move the main cursor immediately
      document.addEventListener('mousemove', function (e) {
        mx = e.clientX;
        my = e.clientY;

        if (!moved) {
          moved = true;
          cursor.classList.add('visible');
          ring.classList.add('visible');
        }

        cursor.style.transform =
          'translate3d(' + mx + 'px, ' + my + 'px, 0) translate(-50%, -50%)';
      }, { passive: true });

      // Hide when the mouse leaves the window
      document.addEventListener('mouseleave', function () {
        cursor.classList.remove('visible');
        ring.classList.remove('visible');
      });
      document.addEventListener('mouseenter', function () {
        if (moved) {
          cursor.classList.add('visible');
          ring.classList.add('visible');
        }
      });

      // Trailing ring — lerp toward the mouse position
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!prefersReduced) {
        (function tick() {
          rx += (mx - rx) * 0.18;
          ry += (my - ry) * 0.18;
          ring.style.transform =
            'translate3d(' + rx + 'px, ' + ry + 'px, 0) translate(-50%, -50%)';
          requestAnimationFrame(tick);
        })();
      } else {
        document.addEventListener('mousemove', function () {
          ring.style.transform =
            'translate3d(' + mx + 'px, ' + my + 'px, 0) translate(-50%, -50%)';
        }, { passive: true });
      }

      // Hover state — glow on interactive elements
      const INTERACTIVE = 'a, button, [role="button"], .tool-card, .section-toggle, .theme-toggle, .profile-btn, .stat';
      const TEXT_INPUTS = 'input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="search"], input[type="tel"], input[type="url"], textarea';

      document.addEventListener('mouseover', function (e) {
        const t = e.target;
        if (!t || !t.closest) return;
        if (t.closest(INTERACTIVE)) cursor.classList.add('hovering');
        if (t.closest(TEXT_INPUTS)) cursor.classList.add('text-mode');
      });

      document.addEventListener('mouseout', function (e) {
        const to = e.relatedTarget;
        if (!to || !to.closest) {
          cursor.classList.remove('hovering', 'text-mode');
          return;
        }
        if (!to.closest(INTERACTIVE)) cursor.classList.remove('hovering');
        if (!to.closest(TEXT_INPUTS)) cursor.classList.remove('text-mode');
      });

      // Click feedback
      document.addEventListener('mousedown', function () {
        cursor.classList.add('clicking');
      });
      document.addEventListener('mouseup', function () {
        cursor.classList.remove('clicking');
      });

      // Also handle the case where the user opens the profile dropdown
      // so the cursor stays on top of it (z-index 99999 handles it anyway)
    })();
  </script>
</body>

</html>
