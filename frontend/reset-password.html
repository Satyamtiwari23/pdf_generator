<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Reset Password — PDFnest</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />


  <link rel="stylesheet" href="style.css" />


  <style>

    #message {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
    }

    #message.success {
      color: #22c55e;
    }

    #message.error {
      color: #ef4444;
    }

  </style>


  <script src="theme.js"></script>

</head>


<body>

  <div class="auth-container">

    <div class="auth-card">

      <h2>Create a new password</h2>

      <p class="subtitle">
        Enter your new PDFnest password below.
      </p>


      <form id="resetForm">


        <!-- NEW PASSWORD -->

        <div class="auth-field">

          <label for="password">
            New Password
          </label>


          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="••••••••"
              minlength="6"
              required
            />


            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="auth-field">

          <label for="confirmPassword">
            Confirm Password
          </label>


          <div class="password-wrapper">

            <input
              type="password"
              id="confirmPassword"
              placeholder="••••••••"
              minlength="6"
              required
            />


            <button
              type="button"
              class="password-toggle"
              id="confirmPasswordToggle"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <!-- RESET BUTTON -->

        <button
          type="submit"
          class="auth-btn"
          id="submitBtn"
        >
          Reset Password
        </button>


        <!-- MESSAGE -->

        <div id="message"></div>


      </form>


      <div class="auth-switch">

        Remember your password?
        <a href="login.html">Log in</a>

      </div>

    </div>

  </div>


  <script>

    /* ==========================================
       API URL
    ========================================== */

    const API_URL =
      (window.location.hostname === 'localhost' ||
       window.location.hostname === '127.0.0.1')

        ? 'http://localhost:5050/api/auth'

        : 'https://pdf-generator-ochre-two.vercel.app/api/auth';


    /* ==========================================
       GET RESET TOKEN
    ========================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const token =
      params.get('token');


    /* ==========================================
       ELEMENTS
    ========================================== */

    const form =
      document.getElementById('resetForm');

    const password =
      document.getElementById('password');

    const confirmPassword =
      document.getElementById('confirmPassword');

    const submitBtn =
      document.getElementById('submitBtn');

    const message =
      document.getElementById('message');


    /* ==========================================
       PASSWORD VISIBILITY
    ========================================== */

    function setupToggle(inputId, buttonId) {

      const input =
        document.getElementById(inputId);

      const button =
        document.getElementById(buttonId);


      button.addEventListener('click', () => {

        const hidden =
          input.type === 'password';


        input.type =
          hidden
            ? 'text'
            : 'password';


        button.textContent =
          hidden
            ? '◉'
            : '👁';

      });

    }


    setupToggle(
      'password',
      'passwordToggle'
    );


    setupToggle(
      'confirmPassword',
      'confirmPasswordToggle'
    );


    /* ==========================================
       RESET PASSWORD
    ========================================== */

    form.addEventListener('submit', async (e) => {

      e.preventDefault();


      // Clear previous message
      message.textContent = '';
      message.className = '';


      /* ========================================
         TOKEN CHECK
      ======================================== */

      if (!token) {

        message.textContent =
          'Invalid or missing reset link.';

        message.className = 'error';

        return;

      }


      /* ========================================
         PASSWORD MATCH CHECK
      ======================================== */

      if (
        password.value !==
        confirmPassword.value
      ) {

        message.textContent =
          'Passwords do not match.';

        message.className = 'error';

        return;

      }


      /* ========================================
         PASSWORD LENGTH CHECK
      ======================================== */

      if (password.value.length < 6) {

        message.textContent =
          'Password must be at least 6 characters.';

        message.className = 'error';

        return;

      }


      /* ========================================
         START REQUEST
      ======================================== */

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';


      try {

        const res = await fetch(
          `${API_URL}/reset-password`,
          {
            method: 'POST',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              token: token,
              password: password.value
            })
          }
        );


        const data =
          await res.json();


        /* ======================================
           SERVER ERROR
        ====================================== */

        if (!res.ok) {

          throw new Error(
            data.message ||
            'Password reset failed.'
          );

        }


        /* ======================================
           SUCCESS
        ====================================== */

        message.textContent =
          data.message ||
          'Password reset successfully. Redirecting to login...';

        message.className = 'success';


        /* ======================================
           REDIRECT
        ====================================== */

        setTimeout(() => {

          window.location.replace(
            'login.html'
          );

        }, 1800);


      } catch (error) {

        /* ======================================
           ERROR
        ====================================== */

        console.error(
          'Reset password error:',
          error
        );


        message.textContent =
          error.message ||
          'Password reset failed.';

        message.className = 'error';


        submitBtn.disabled = false;

        submitBtn.textContent =
          'Reset Password';

      }

    });

  </script>

</body>

</html>
